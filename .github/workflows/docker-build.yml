
name: Docker Build

on:
  workflow_call:
    inputs:
      image-name:
        description: ECR repository name
        required: true
        type: string
      context:
        description: Docker build context
        required: true
        type: string
      dockerfile:
        description: Dockerfile path
        required: true
        type: string

jobs:
  build:
    name: Build and Push ${{ inputs.image-name }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ap-south-1
      ECR_REGISTRY: 981006822520.dkr.ecr.ap-south-1.amazonaws.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Inspect GitHub OIDC claims
        shell: bash
        run: |
          node <<'NODE'
          async function main() {
            const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            url.searchParams.set('audience', 'sts.amazonaws.com');

            const response = await fetch(url, {
              headers: {
                Authorization: `bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`
              }
            });

            if (!response.ok) {
              throw new Error(`OIDC request failed: ${response.status}`);
            }

            const { value } = await response.json();
            const payload = JSON.parse(
              Buffer.from(value.split('.')[1], 'base64url').toString()
            );

            console.log(JSON.stringify({
              iss: payload.iss,
              aud: payload.aud,
              sub: payload.sub,
              repository: payload.repository,
              ref: payload.ref,
              event_name: payload.event_name
            }, null, 2));
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::981006822520:role/GitHubActions-NotifyFlow-ECR
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ inputs.image-name }}:latest
            ${{ env.ECR_REGISTRY }}/${{ inputs.image-name }}:${{ github.sha }}
